[custom]
; clash 分流规则

; ==================== 规则优先级（自上而下匹配） ====================
; 1. 私有局域网必须放在最首位，保证本地连接/NAS/路由器不走代理
ruleset=🏠 私有网络,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/private.mrs
ruleset=🏠 私有网络,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geoip/private.mrs,no-resolve

; 2. 具体的境外特定服务
ruleset=💬 AI 服务,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
ruleset=📹 油管视频,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/youtube.mrs
ruleset=🔎 谷歌服务,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/google.mrs
ruleset=💻 github,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/github.mrs
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/apple.mrs

; 3. 泛境外服务
ruleset=🌐 非中国,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

; 4. 国内服务（直连）
ruleset=🇨🇳 国内服务,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geosite/cn.mrs
ruleset=🇨🇳 国内服务,https://raw.githubusercontent.com/justly110/meta-rules-dat/meta/geo/geoip/cn.mrs,no-resolve

; 5. 兜底规则（Clash 中对应 - MATCH,🐟 漏网之鱼）
ruleset=🐟 漏网之鱼,[]FINAL


; ==================== 基础与分流策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]👆 手动选择`[]DIRECT`.*
custom_proxy_group=👆 手动选择`select`.*
custom_proxy_group=⚡ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=💬 AI 服务`select`[]🚀 节点选择`[]👆 手动选择
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择``[]👆 手动选择
custom_proxy_group=🔎 谷歌服务`select`[]🚀 节点选择`[]👆 手动选择
custom_proxy_group=💻 github`select`[]🚀 节点选择`[]👆 手动选择`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🌐 非中国`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🇨🇳 国内服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🏠 私有网络`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`.*


enable_rule_generator=true
overwrite_original_rules=true
